version: '3.8'

services:
  file-converter:
    build: .
    container_name: file_to_csv_converter
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MAX_CONTENT_LENGTH=10737418240 # 10 GB limit
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    restart: unless-stopped
